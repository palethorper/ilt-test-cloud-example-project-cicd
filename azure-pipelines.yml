trigger:
  - main

pool:
  vmImage: 'windows-latest' # Build agents must be Windows-based

variables:
  NUGET_PACKAGES: '$(Pipeline.Workspace)/.nuget/packages' # Restore location NuGet/uipcli will use and that we cache below

steps:
# 0a. Cache the downloaded UiPath CLI tool so it isn't re-fetched from the feed every run
- task: Cache@2
  displayName: 'Cache UiPath CLI'
  inputs:
    key: 'uipcli | "$(Agent.OS)" | "Windows.25.10.7"'
    path: '$(Agent.ToolsDirectory)/uipcli'

# 0b. Cache restored NuGet packages (activity dependencies) so UiPathPack doesn't re-download them every run
- task: Cache@2
  displayName: 'Cache NuGet packages'
  inputs:
    key: 'nuget | "$(Agent.OS)" | project.json'
    restoreKeys: |
      nuget | "$(Agent.OS)"
    path: '$(NUGET_PACKAGES)'

# 1. Ensure the UiPath CLI toolset is installed on the agent
- task: UiPathInstallPlatform@6
  inputs:
    cliVersion: 'Windows.25.10.7'

# 2. Package your UiPath Test Automation Project
- task: UiPathPack@6
  inputs:
    versionType: 'AutoVersion'
    projectJsonPath: '$(Build.SourcesDirectory)/project.json'
    outputPath: '$(Build.ArtifactStagingDirectory)'
    outputType: 'Tests' # Set type specifically to Tests

# 3. Deploy the package into your Test Orchestrator
- task: UiPathDeploy@6
  inputs:
    orchestratorConnection: 'UiPath-ANZ_PS_Staging'
    folderName: 'Shared'
    packagesPath: '$(Build.ArtifactStagingDirectory)'

# 4. Trigger and execute your Test Cases
- task: UiPathTest@6
  inputs:
    orchestratorConnection: 'UiPath-ANZ_PS_Staging'
    folderName: 'Shared'
    testStrategy: 'TestSet' # Or 'TestProject' for transient runs
    testSet: 'Regression_Test_Set' # Name of pre-defined test set
    junitReportPath: '$(Build.ResultsDirectory)/test-results.xml'

